# The release pipeline's Linux leg (infra/src/release-stack.ts): the AppImage and deb with
# latest-linux.yml, the signed APK, and both apps' SBOMs, handed to the publish leg under
# releases/<tag>/.
# RELEASE_TAG comes from the pipeline or scripts/try-release.sh; the rest from the project.

version: 0.2

env:
  # The default shell is sh, which has no pipefail.
  shell: bash

phases:
  install:
    runtime-versions:
      nodejs: 24
      java: corretto21
    commands:
      # The image has no Android SDK; the versions follow mobile/android/variables.gradle.
      - |
        set -euo pipefail
        sdk="$HOME/android-sdk"
        mkdir -p "$sdk/cmdline-tools"
        curl -fsSL -o /tmp/cmdline-tools.zip \
          https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q /tmp/cmdline-tools.zip -d "$sdk/cmdline-tools"
        mv "$sdk/cmdline-tools/cmdline-tools" "$sdk/cmdline-tools/latest"
        # yes ends with SIGPIPE once sdkmanager stops reading; only sdkmanager's status counts.
        (yes || true) | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
        "$sdk/cmdline-tools/latest/bin/sdkmanager" \
          'platforms;android-36' 'build-tools;36.0.0' platform-tools >/dev/null
      - corepack enable
      - pnpm install --frozen-lockfile

  build:
    commands:
      - |
        set -euo pipefail
        : "${RELEASE_TAG:?not set; expected from the pipeline or try-release.sh}"
        : "${DOWNLOADS_URL:?not set; expected from the project}"
        version=${RELEASE_TAG#v}
        echo "tag=$RELEASE_TAG version=$version feed=$DOWNLOADS_URL"
        # electron-builder takes the version from package.json; never committed.
        (cd desktop && npm pkg set version="$version")
        pnpm --filter @newses/desktop build:linux:release

        export ANDROID_HOME="$HOME/android-sdk" JAVA_HOME="$JAVA_21_HOME"
        export ANDROID_KEYSTORE_FILE=/tmp/release.jks
        printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d >"$ANDROID_KEYSTORE_FILE"
        chmod +x mobile/android/gradlew
        pnpm --filter @newses/mobile build:apk:release

        # Desktop's SBOM serves the Windows leg's build too: the same packages on every platform.
        for deliverable in desktop mobile; do
          node infra/src/release/build-sbom.ts --deliverable "$deliverable" --tag "$RELEASE_TAG" --out sbom
        done

        # Exactly these, so a failed or misnamed build stops here.
        files=(
          "desktop/release/newses-$version-linux-x86_64.AppImage"
          "desktop/release/newses-$version-linux-amd64.deb"
          desktop/release/latest-linux.yml
          "mobile/release/newses-$version-android.apk"
          "sbom/newses-$version-desktop.cdx.json"
          "sbom/newses-$version-mobile.cdx.json"
        )
        for file in "${files[@]}"; do
          aws s3 cp --only-show-errors "$file" "s3://$ARTIFACT_BUCKET/releases/$RELEASE_TAG/"
        done
        echo "Handed over ${#files[@]} files"
