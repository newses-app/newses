# The release pipeline's publish leg (infra/src/release-stack.ts), after both build legs:
# uploads the release to the stage's downloads bucket, checks every published URL, then marks
# the prerelease it replaced to expire. DRY_RUN=true (scripts/try-release.sh) uploads nothing.
# RELEASE_TAG comes from the pipeline or scripts/try-release.sh; the rest from the project.

version: 0.2

env:
  # The default shell is sh, which has no pipefail.
  shell: bash

phases:
  install:
    runtime-versions:
      nodejs: 24
    commands:
      - corepack enable
      - pnpm install --frozen-lockfile --filter '@rss-reader/infra...'

  build:
    commands:
      - |
        set -euo pipefail
        : "${RELEASE_TAG:?not set; expected from the pipeline or try-release.sh}"
        : "${DOWNLOADS_BUCKET:?not set; expected from the project}"
        dry_run=${DRY_RUN:-false}
        version=${RELEASE_TAG#v}
        flag=()
        [ "$PRERELEASE" = true ] && flag=(--prerelease)

        mkdir -p artifacts
        aws s3 sync --only-show-errors "s3://$ARTIFACT_BUCKET/releases/$RELEASE_TAG/" artifacts/
        node infra/src/release/publish.ts --dir artifacts --tag "$RELEASE_TAG" \
          --url "$DOWNLOADS_URL" "${flag[@]}"

        if [ "$dry_run" = true ]; then
          echo "Dry run: would upload to s3://$DOWNLOADS_BUCKET:"
          cut -f2- artifacts/plan.tsv
          exit 0
        fi

        previous=$(aws s3 cp "s3://$DOWNLOADS_BUCKET/downloads/latest.json" - 2>/dev/null |
          node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{try{console.log(JSON.parse(s).version)}catch{}})' || true)

        # Versioned files first, so the feeds and page never point at a missing file.
        while IFS=$'\t' read -r file key type cache disposition; do
          aws s3 cp --only-show-errors "$file" "s3://$DOWNLOADS_BUCKET/$key" \
            --content-type "$type" --cache-control "$cache" --content-disposition "$disposition"
        done <artifacts/plan.tsv

        bad=0
        while read -r url; do
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -I "$url" || echo 000)
          echo "$code $url"
          [ "$code" = 200 ] || bad=1
        done <artifacts/urls.txt
        [ "$bad" = 0 ] || { echo 'A published URL is unreachable' >&2; exit 1; }

        # The lifecycle rule expires the replaced prerelease's files.
        if [ "$PRERELEASE" = true ] && [ -n "$previous" ] && [ "$previous" != "$version" ]; then
          for key in $(aws s3api list-objects-v2 --bucket "$DOWNLOADS_BUCKET" \
            --prefix "downloads/$previous/" --query 'Contents[].Key' --output text); do
            [ "$key" = None ] && continue
            aws s3api put-object-tagging --bucket "$DOWNLOADS_BUCKET" --key "$key" \
              --tagging 'TagSet=[{Key=superseded,Value=true}]'
          done
          echo "Marked $previous to expire"
        fi
        echo "Published $version to $DOWNLOADS_URL/"
