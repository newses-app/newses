name: newses

x-app: &app
  image: ${NEWSES_IMAGE:-newses:latest}
  build:
    context: ..
    dockerfile: docker/Dockerfile
  restart: unless-stopped
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    APP_SECRET: ${APP_SECRET:?set APP_SECRET in docker/.env}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    COMPAT_TRACE: ${COMPAT_TRACE:-false}
    PUBLIC_URL: ${PUBLIC_URL:-}
    TRUST_PROXY: ${TRUST_PROXY:-false}
    FETCH_ALLOW_PRIVATE_NETWORKS: ${FETCH_ALLOW_PRIVATE_NETWORKS:-}
    FEED_UPDATE_INTERVAL_MINUTES: ${FEED_UPDATE_INTERVAL_MINUTES:-30}
    FEED_PURGE_DAYS: ${FEED_PURGE_DAYS:-180}
    ARCHIVE_ENABLED: ${ARCHIVE_ENABLED:-true}
    FEED_DISABLE_AFTER_FAILURES: ${FEED_DISABLE_AFTER_FAILURES:-20}
    ADMIN_LOGIN: ${ADMIN_LOGIN:-}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    OPS_RETENTION_DAYS: ${OPS_RETENTION_DAYS:-90}
    AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
    OPS_HOST_HOURLY_BUDGET: ${OPS_HOST_HOURLY_BUDGET:-200}
    SMTP_URL: ${SMTP_URL:-}
    ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
    ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
    # OpenTelemetry export is off unless an endpoint is set (e.g. http://lgtm:4318).
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
    OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1}
    OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-15000}
    OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=${DEPLOYMENT_ENVIRONMENT:-self-hosted}

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    <<: *app
    command: migrate
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy

  server:
    <<: *app
    command: server
    ports:
      - '${HTTP_PORT:-8080}:8080'
    volumes:
      - blobs:/data/blobs
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/healthz']
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  worker:
    <<: *app
    command: worker
    volumes:
      - blobs:/data/blobs
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Nightly pg_dump. Enable with: docker compose --profile backup up -d
  backup:
    image: postgres:18-alpine
    profiles: [backup]
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - backups:/backups
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          pg_dump -Fc -f "/backups/newses-$$(date +%Y%m%d-%H%M%S).dump" && echo "Backup written"
          find /backups -name '*.dump' -mtime +"$$RETENTION_DAYS" -delete
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy

  # Grafana with Tempo, Loki, and Prometheus for traces, logs, and metrics, on 127.0.0.1 only.
  # Enable with: docker compose --profile observability up -d, and set
  # OTEL_EXPORTER_OTLP_ENDPOINT=http://lgtm:4318 in docker/.env.
  lgtm:
    image: grafana/otel-lgtm:0.33.1
    profiles: [observability]
    restart: unless-stopped
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-3000}:3000'
    volumes:
      - lgtm:/data
      - ./observability/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/newses.yaml:ro
      - ./observability/dashboards:/otel-lgtm/newses-dashboards:ro

volumes:
  db:
  blobs:
  backups:
  lgtm:
