# Override for running behind nginx-proxy (and optionally acme-companion):
#   docker compose -f docker/compose.yaml -f docker/compose.nginx-proxy.yaml up -d
# The server joins nginx-proxy's network and is no longer published on the host,
# so forwarded headers can only come from the proxy.
services:
  server:
    ports: !reset []
    environment:
      VIRTUAL_HOST: ${VIRTUAL_HOST:?set VIRTUAL_HOST in docker/.env}
      VIRTUAL_PORT: '8080'
      LETSENCRYPT_HOST: ${LETSENCRYPT_HOST:-}
      TRUST_PROXY: ${TRUST_PROXY:-1}
    networks:
      - default
      - proxy

networks:
  proxy:
    external: true
    name: ${NGINX_PROXY_NETWORK:-nginx-proxy}
