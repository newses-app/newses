# Unsigned builds: `pnpm build:win` (per-user NSIS, zip, portable exe) and `pnpm build:linux`
# (AppImage, deb).
appId: app.newses
productName: Newses
copyright: Copyright © Newses contributors

directories:
  output: release
  buildResources: build

files:
  - out/**
  - '!out/**/*.map'
  - package.json

asar: true

electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false

win:
  # Prebuilt: electron-builder's PNG converter needs more memory than the CodeBuild Windows
  # container allows.
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
    # The unpacked app, to run without installing; not updated by electron-updater.
    - target: zip
      arch: [x64]
    # One exe that unpacks the app on each launch and keeps its data beside it (portable.ts); not
    # updated by electron-updater.
    - target: portable
      arch: [x64]
  artifactName: newses-${version}-windows-${arch}.${ext}

nsis:
  oneClick: true
  perMachine: false
  artifactName: newses-${version}-windows-setup.${ext}

portable:
  artifactName: newses-${version}-windows-portable.${ext}
  # A new folder for each launch: by default each build unpacks to one fixed folder, which a second
  # launch would delete while the first still runs from it.
  unpackDirName: false

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Network
  executableName: newses
  # Links the running window to the .desktop entry (desktopName in package.json).
  syncDesktopName: true
  maintainer: Newses contributors
  synopsis: Self-hosted feed reader
  artifactName: newses-${version}-linux-${arch}.${ext}
