packages:
  - desktop
  - infra
  - mobile
  - server
  - shared
  - web

allowBuilds:
  cpu-features: false
  # Electron downloads its binary when first run, so installs (and the pipeline) never fetch it.
  electron: false
  electron-winstaller: false
  esbuild: false
  protobufjs: false
  sharp: set this to true or false
  ssh2: false
  unrs-resolver: false
  vue-demi: false

# Type-aware linting needs more than the default heap on 2 GB-limited build hosts.
nodeOptions: --max-old-space-size=4096
