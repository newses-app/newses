packages:
  - infra
  - server
  - shared
  - web

allowBuilds:
  cpu-features: false
  esbuild: false
  protobufjs: false
  ssh2: false
  unrs-resolver: false
  vue-demi: false

# Type-aware linting needs more than the default heap on 2 GB-limited build hosts.
nodeOptions: --max-old-space-size=4096
